name: Release macOS installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} DMG
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            rust_target: aarch64-apple-darwin
          - name: Intel
            rust_target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DMG
        run: npm run tauri build -- --target ${{ matrix.rust_target }} --bundles dmg

      - name: Verify app bundle contains a readable macOS icon
        run: |
          icon_path="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/ShrinkOS.app/Contents/Resources/icon.icns"
          test -s "$icon_path"
          sips -g format "$icon_path"

      - name: Verify DMG was created
        run: test -n "$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.rust_target }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: release-dmgs

      - name: Verify both DMGs were downloaded
        run: test "$(find release-dmgs -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release-dmgs/*.dmg
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
